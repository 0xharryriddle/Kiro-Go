services:
  kiro-go:
    build: .
    # MERGE POLICY NOTE (fork ↔ hian699 v1.2.8): the merge appended the incoming
    # side's whole ports list after ours instead of reconciling the two, and dropped
    # its `- LOOPBACK_HOST=0.0.0.0` env entry INSIDE the healthcheck mapping below.
    # That last one made this file invalid YAML — `docker compose config` failed with
    # "did not find expected key", so the entire deploy path was broken while
    # `go build`/`go test` stayed green. Both parent revisions parse cleanly, so the
    # breakage was introduced by the merge, not inherited.
    #
    # The incoming port entries are dropped rather than kept, each for a measured
    # reason:
    #
    #   - `8080:8080` duplicated the `${KIRO_PORT:-8080}:8080` line below, which
    #     silently defeats the override: `KIRO_PORT=9090 docker compose up -d` would
    #     publish 9090 AND still bind 8080, so a second stack could not start.
    #   - a bare `3128:3128` re-publishes the Enterprise-SSO callback on EVERY host
    #     interface, undoing the deliberate `127.0.0.1:` pin below. That pin is the
    #     control keeping a transient, anti-CSRF-state-matched callback off the host's
    #     external interfaces, so this was a security regression, not a duplicate.
    #   - `4649`, `6588`, `8008`, `9091` publish nothing in this tree. They come from
    #     the ten fixed Kiro loopback ports described in
    #     .kiro/specs/kiro-sso-external-idp-hardening/, which is a DESIGN doc: no
    #     `kiroLoopbackPorts` symbol exists in any .go file and
    #     auth/kiro_sso.go:62 still pins `kiroRedirectPort = "3128"`. If a later round
    #     implements the multi-port fallback, re-add them together with that code.
    ports:
      # Host port is overridable: `KIRO_PORT=9090 docker compose up -d` publishes
      # 9090 on the host. The container always listens on 8080 internally.
      - "${KIRO_PORT:-8080}:8080"
      # Enterprise SSO (Microsoft 365) callback. The hosted-portal sign-in
      # redirects the browser to localhost:3128, so the operator must run that
      # browser ON THE DOCKER HOST. Publishing host-side to 127.0.0.1 only keeps
      # the callback off the host's external interfaces while still letting the
      # host browser's localhost:3128 reach the container listener below.
      - "127.0.0.1:3128:3128"
    volumes:
      - ./data:/app/data
      # Zero-touch credential drop folder. Any CLIProxyAPI_*.json minted by
      # kiro-login-helper.py and dropped in ./data/imports is auto-imported within
      # ~15s (then moved to ./data/imports/processed). It is a subpath of the data
      # mount above, so no extra mount is strictly required — kept explicit for clarity.
      - ./data/imports:/app/data/imports
      # Let the Dockerized app import the Kiro IDE credential cached on the host.
      # The app runs as root in the container, so its default ~/.aws path would be
      # /root/.aws/...; mount the host user's AWS SSO cache directory explicitly.
      # Directory mount is portable across Linux/macOS and lets the container start
      # even when the cache file has not been created yet.
      - ${KIRO_AWS_SSO_CACHE_DIR:-${HOME}/.aws/sso/cache}:/host-aws-sso-cache:ro
    environment:
      # Admin panel password, supplied from the GITIGNORED ./.env (see .env.example).
      #
      # REQUIRED for this stack to boot. main.go:104 refuses to start when the stored
      # password is still the default `changeme` AND the bind host is non-loopback —
      # and HOST below is 0.0.0.0, so the guard always applies here. The "or bind to
      # 127.0.0.1" escape in that error message is NOT usable in Docker: a container
      # loopback listener cannot be reached through the published port mapping, so the
      # env override is the only viable fix.
      #
      # Not persisted: config.SetPassword stores this in `passwordOverride`, which
      # Save() deliberately never writes to data/config.json (L9), so the secret stays
      # out of the config file and out of `/admin/api/config/export`.
      #
      # Deliberately defaulted to empty rather than `${ADMIN_PASSWORD:?}`: the fail-loud
      # form breaks `docker compose config`, which scripts/verify.sh runs as a gate, in
      # any checkout without a .env. Enforcement belongs in the app's guard (one place),
      # not duplicated in the manifest — an unset value simply produces main.go's
      # explicit refusal instead of a confusing compose interpolation error.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CONFIG_PATH=/app/data/config.json
      - KIRO_IDE_CACHE=/host-aws-sso-cache/kiro-auth-token.json
      # Force the app's in-container listen port to match the published
      # container-side port above. This prevents a stale data/config.json port
      # (for example 8081) from making `localhost:8080` unreachable.
      - PORT=8080
      - HOST=0.0.0.0
      # Enable the auto-ingest watcher (off by default on a bare build). Drop a
      # CLIProxyAPI_*.json into ./data/imports and the account appears with no
      # restart and no manual API call. Imports go through the same persisted path
      # the live server owns, so they never race the in-memory config.
      - KIRO_IMPORT_WATCH=1
      # Bind host for the Enterprise SSO callback listener INSIDE the container.
      # Default (unset) is loopback-only (127.0.0.1/::1), which the published port
      # above cannot reach; 0.0.0.0 lets the forwarded connection land. The callback
      # is transient (~10-minute login window) and anti-CSRF state-matched, and the
      # host-side publish is pinned to loopback above, so it is not reachable off the
      # host. Note 0.0.0.0 does expose 3128 to peer containers on the same Docker
      # network during that window; on a shared/untrusted Docker network, pin
      # KIRO_SSO_CALLBACK_BIND to a specific interface or isolate the network.
      #
      # This is the ONLY callback-bind knob this tree reads. The incoming side used
      # LOOPBACK_HOST for the same job, but its Go reader did not survive the merge:
      # `grep -rn LOOPBACK_HOST --include='*.go'` matches nothing here, while
      # auth/kiro_sso.go:299 reads KIRO_SSO_CALLBACK_BIND. Setting LOOPBACK_HOST
      # would therefore look like configuration and change nothing, so it is dropped
      # rather than relocated into this block.
      - KIRO_SSO_CALLBACK_BIND=0.0.0.0
    dns:
      # Avoid transient Docker embedded-DNS failures during Microsoft token refresh.
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
